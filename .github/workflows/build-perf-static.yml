name: Build static Android perf

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - lineage-22.2
    paths:
      - ".github/workflows/build-perf-static.yml"
      - "android_kernel_xiaomi_sdm710_perf_gj/**"
      - "tools/perf/**"
      - "tools/build/**"
      - "tools/lib/**"
      - "tools/include/**"
      - "arch/arm64/**"
      - "include/**"
      - "1.md"
  pull_request:
    branches:
      - main
      - master
      - lineage-22.2
    paths:
      - ".github/workflows/build-perf-static.yml"
      - "android_kernel_xiaomi_sdm710_perf_gj/**"
      - "tools/perf/**"
      - "tools/build/**"
      - "tools/lib/**"
      - "tools/include/**"
      - "arch/arm64/**"
      - "include/**"
      - "1.md"

permissions:
  contents: read

concurrency:
  group: build-static-perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      OUT_DIR: ${{ github.workspace }}/out/grus-perf-ci
      TOOLCHAIN_DIR: ${{ github.workspace }}/.ci-toolchains
      NDK_VERSION: 25.1.8937393

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            curl \
            file \
            flex \
            python3

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;$NDK_VERSION"

      - name: Download kernel toolchains
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TOOLCHAIN_DIR/clang-r536225" \
                   "$TOOLCHAIN_DIR/aarch64-linux-android-4.9" \
                   "$TOOLCHAIN_DIR/arm-linux-androideabi-4.9"

          download_and_extract() {
            local url="$1"
            local dest_dir="$2"
            local archive

            archive="$(mktemp)"
            curl --fail --location \
              --retry 8 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 30 \
              --output "$archive" \
              "$url"
            tar -xzf "$archive" -C "$dest_dir"
            rm -f "$archive"
          }

          download_and_extract \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/%2Barchive/7143812acf96c9af445b164656ae7f424a67a573/clang-r536225.tar.gz" \
            "$TOOLCHAIN_DIR/clang-r536225"

          download_and_extract \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/%2Barchive/0a0604336d4d1067aa1aaef8d3779b31fcee841d.tar.gz" \
            "$TOOLCHAIN_DIR/aarch64-linux-android-4.9"

          download_and_extract \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/%2Barchive/4d16d93f49c2b5ecdd0f12c38d194835dd595603.tar.gz" \
            "$TOOLCHAIN_DIR/arm-linux-androideabi-4.9"

      - name: Build static perf
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION" \
          CLANG_DIR="$TOOLCHAIN_DIR/clang-r536225/bin" \
          A64_DIR="$TOOLCHAIN_DIR/aarch64-linux-android-4.9/bin" \
          ARM32_DIR="$TOOLCHAIN_DIR/arm-linux-androideabi-4.9/bin" \
          OUT_DIR="$OUT_DIR" \
          PERF_OUT="$OUT_DIR/tools/perf-static" \
          JOBS=4 \
          bash android_kernel_xiaomi_sdm710_perf_gj/build-perf-static.sh

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$RUNNER_TEMP/perf-static-artifacts"
          mkdir -p "$ARTIFACT_DIR"
          cp "$OUT_DIR/tools/perf-static/perf" "$ARTIFACT_DIR/perf"
          cp "$OUT_DIR/tools/perf-static/FEATURE-DUMP" "$ARTIFACT_DIR/"
          cp "$OUT_DIR/tools/perf-static/.config-detected" "$ARTIFACT_DIR/config-detected"
          file "$ARTIFACT_DIR/perf" > "$ARTIFACT_DIR/perf.file.txt"
          "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d "$ARTIFACT_DIR/perf" > "$ARTIFACT_DIR/perf.dynamic.txt"
          echo "ARTIFACT_DIR=$ARTIFACT_DIR" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-static-perf-${{ github.run_number }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
